<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Joyería Aurora</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header">
    <div class="brand">
      <h1 class="brand-title">JOYERÍA AURORA</h1>
      <span class="brand-sub">Alta Joyería desde 2026</span>
    </div>
    <nav class="nav-menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html" class="active">Productos</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main class="container">
    <h2>Catálogo Completo</h2>
    <div id="productsGrid" class="products-grid"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Joyería Aurora - Todos los derechos reservados</p>
  </footer>

  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('productsGrid');
      if (container && typeof PRODUCTS !== 'undefined') {
        PRODUCTS.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="${p.image}" alt="${p.name}">
            <h4>${p.name}</h4>
            <p style="color:var(--accent-gold); font-weight:bold;">$${p.price.toLocaleString('es-CO')} COP</p>
          `;
          container.appendChild(card);
        });
      }
    });
  </script>
</body>
</html>
